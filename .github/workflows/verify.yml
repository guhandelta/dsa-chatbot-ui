name: Verify UI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test -- --dir src
      - run: npm run build
      - name: Browser smoke tests
        run: |
          ./node_modules/.bin/vite dev --port 3000 --host 0.0.0.0 --strictPort > "$RUNNER_TEMP/vite.log" 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$vite_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/vite.log"
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/vite.log"
            echo "Vite did not become ready at http://127.0.0.1:3000 within 60 seconds."
            exit 1
          fi

          npx cypress run --browser chrome
